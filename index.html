<script>
/* ============================================================================
   GAIA LAKE BUNGALOW — ASSETS & INVENTORY MANAGER
   Vanilla JS + IndexedDB, self-contained single-file application.
   ============================================================================ */
(function(){
"use strict";

/* ---------------------------------------------------------------------------
   0. STATIC CONFIG — locations, categories, conditions
--------------------------------------------------------------------------- */
const LOCATIONS = [
  { code:"R1",  name:"Room 1",         zone:"Guest Areas" },
  { code:"R2",  name:"Room 2",         zone:"Guest Areas" },
  { code:"R3",  name:"Room 3",         zone:"Guest Areas" },
  { code:"R4",  name:"Room 4",         zone:"Guest Areas" },
  { code:"POOL",name:"Pool",           zone:"Guest Areas" },
  { code:"GDN", name:"Garden",         zone:"Guest Areas" },
  { code:"LBY", name:"Lobby",          zone:"Guest Areas" },
  { code:"GPT", name:"Guest Pantry",   zone:"Guest Areas" },
  { code:"KIT", name:"Main Kitchen",   zone:"Operations" },
  { code:"SR1", name:"Store Room 1",   zone:"Operations" },
  { code:"SR2", name:"Store Room 2",   zone:"Operations" },
  { code:"SR3", name:"Store Room 3",   zone:"Operations" },
  { code:"GEN", name:"Generator Room", zone:"Operations" },
  { code:"MGR", name:"Manager Room",   zone:"Staff & Management" },
  { code:"ST1", name:"Staff room 1",   zone:"Staff & Management" },
  { code:"ST2", name:"Staff room 2",   zone:"Staff & Management" },
];
const ZONES = ["Guest Areas","Operations","Staff & Management"];

let CATEGORIES = [
  { code:"ELE", name:"Electronics" },
  { code:"FUR", name:"Furniture" },
  { code:"LIN", name:"Linen" },
  { code:"UTL", name:"Utilities" },
  { code:"APP", name:"Appliances" },
];
const DEFAULT_CATEGORIES = CATEGORIES.map(c=>Object.assign({},c));

/* Smart Asset Codes — derive a 3-letter code from a custom category name,
   falling back to a numbered suffix if the derived code already exists. */
function deriveCategoryCode(name){
  let base = (name||'').replace(/[^a-zA-Z]/g,'').slice(0,3).toUpperCase();
  if(base.length < 2) base = (base + 'XXX').slice(0,3);
  let code = base, n = 1;
  while(CATEGORIES.some(c=>c.code===code)){
    n++; code = (base.slice(0,2) + n).slice(0,3);
  }
  return code;
}

const CONDITIONS = [
  { key:"Usable",    cls:"badge-usable",    dot:"#16a34a" },
  { key:"Damaged",   cls:"badge-damaged",   dot:"#FFFF00" },
  { key:"In Repair", cls:"badge-repair",    dot:"#FF8000" },
  { key:"Discarded", cls:"badge-discarded", dot:"#dc2626" },
  { key:"Missing",   cls:"badge-missing",   dot:"#6b7280" },
];

function locByCode(c){ return LOCATIONS.find(l=>l.code===c); }
function locByName(n){ return LOCATIONS.find(l=>l.name===n); }
function catByCode(c){ return CATEGORIES.find(x=>x.code===c); }
function catByName(n){ return CATEGORIES.find(x=>x.name===n); }
function condMeta(k){ return CONDITIONS.find(c=>c.key===k) || CONDITIONS[0]; }

/* ---------------------------------------------------------------------------
   1. INDEXEDDB LAYER
--------------------------------------------------------------------------- */
const DB_NAME = "gaia_lake_assets_db";
const DB_VERSION = 1;
let db = null;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const _db = e.target.result;
      if(!_db.objectStoreNames.contains("assets")){
        const s = _db.createObjectStore("assets", { keyPath:"id" });
        s.createIndex("assetNumber","assetNumber",{unique:false});
        s.createIndex("location","location",{unique:false});
        s.createIndex("category","category",{unique:false});
        s.createIndex("condition","condition",{unique:false});
      }
      if(!_db.objectStoreNames.contains("history")){
        const h = _db.createObjectStore("history", { keyPath:"id" });
        h.createIndex("assetNumber","assetNumber",{unique:false});
        h.createIndex("date","date",{unique:false});
      }
      if(!_db.objectStoreNames.contains("settings")){
        _db.createObjectStore("settings", { keyPath:"key" });
      }
      if(!_db.objectStoreNames.contains("meta")){
        _db.createObjectStore("meta", { keyPath:"key" });
      }
    };
    req.onsuccess = (e)=>{ db = e.target.result; resolve(db); };
    req.onerror = (e)=> reject(e.target.error);
  });
}

function tx(storeName, mode){
  return db.transaction(storeName, mode).objectStore(storeName);
}
function idbGetAll(storeName){
  return new Promise((resolve,reject)=>{
    const req = tx(storeName,"readonly").getAll();
    req.onsuccess = ()=>resolve(req.result || []);
    req.onerror = (e)=>reject(e.target.error);
  });
}
function idbGet(storeName,key){
  return new Promise((resolve,reject)=>{
    const req = tx(storeName,"readonly").get(key);
    req.onsuccess = ()=>resolve(req.result || null);
    req.onerror = (e)=>reject(e.target.error);
  });
}
function idbPut(storeName,value){
  return new Promise((resolve,reject)=>{
    const req = tx(storeName,"readwrite").put(value);
    req.onsuccess = ()=>{ resolve(value); scheduleCloudPush(); };
    req.onerror = (e)=>reject(e.target.error);
  });
}
function idbDelete(storeName,key){
  return new Promise((resolve,reject)=>{
    const req = tx(storeName,"readwrite").delete(key);
    req.onsuccess = ()=>{ resolve(true); scheduleCloudPush(); };
    req.onerror = (e)=>reject(e.target.error);
  });
}
function idbClear(storeName){
  return new Promise((resolve,reject)=>{
    const req = tx(storeName,"readwrite").clear();
    req.onsuccess = ()=>{ resolve(true); scheduleCloudPush(); };
    req.onerror = (e)=>reject(e.target.error);
  });
}

/* ---------------------------------------------------------------------------
   2. UTILITIES
--------------------------------------------------------------------------- */
function uuid(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}
function fmtDateTime(d){
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) + ' at ' +
         d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function currencySymbol(){
  return (state.settings.currency === 'LKR') ? 'Rs.' : '$';
}
function fmtMoney(n){
  n = Number(n)||0;
  return currencySymbol() + ' ' + n.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function debounce(fn, ms){
  let t; return function(...args){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,args), ms); };
}

function showToast(msg, type){
  type = type || 'success';
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  const colors = { success:'bg-[#1F6B45]', error:'bg-[#B91C1C]', info:'bg-[#1F2937]' };
  el.className = `${colors[type]||colors.success} text-white text-sm px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 min-w-[220px] animate-[fadeIn_.15s_ease]`;
  el.innerHTML = `<span>${escapeHtml(msg)}</span>`;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2600);
}

let confirmResolver = null;
function askConfirm(title, body){
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-body').textContent = body;
  const dlg = document.getElementById('confirm-dialog');
  dlg.classList.remove('hidden'); dlg.classList.add('flex');
  return new Promise((resolve)=>{ confirmResolver = resolve; });
}
document.getElementById('confirm-ok').addEventListener('click', ()=>{
  document.getElementById('confirm-dialog').classList.add('hidden');
  document.getElementById('confirm-dialog').classList.remove('flex');

/* Google Drive share-link -> embeddable direct-view URL converter.
   NOTE: Google Drive images only embed successfully when the file's sharing
   is set to "Anyone with the link" (Viewer). Even then, Google's classic
   "uc?export=view" endpoint frequently serves an HTML interstitial instead
   of raw image bytes for many files, which silently breaks <img> tags. The
   "thumbnail" endpoint is far more reliable for hotlinked embedding, so we
   convert to that instead. */
function convertImageUrl(url){
  if(!url) return url;
  url = url.trim();
  const patterns = [
    /https?:\/\/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/,
    /https?:\/\/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/,
    /https?:\/\/drive\.google\.com\/uc\?[^\s]*[?&]id=([a-zA-Z0-9_-]+)/,
    /https?:\/\/drive\.google\.com\/thumbnail\?[^\s]*[?&]id=([a-zA-Z0-9_-]+)/,
    /https?:\/\/drive\.usercontent\.google\.com\/download\?[^\s]*[?&]id=([a-zA-Z0-9_-]+)/,
  ];
  for(const re of patterns){
    const m = url.match(re);
    if(m && m[1]){
      return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1000`;
    }
  }
  return url;
}
function isGoogleDriveUrl(url){
  return !!(url && /drive\.google\.com|drive\.usercontent\.google\.com/.test(url));
}

/* Canvas compression for local uploads: max 400px, JPEG q=0.7 */
function compressImageFile(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        const MAX = 400;
        if(width > height && width > MAX){ height = Math.round(height*(MAX/width)); width = MAX; }
        else if(height >= width && height > MAX){ width = Math.round(width*(MAX/height)); height = MAX; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function nextAssetNumber(locationName, categoryName){
  const loc = locByName(locationName), cat = catByName(categoryName);
  if(!loc || !cat) return null;
  const prefix = `${loc.code}-${cat.code}-`;
  const counters = (await idbGet('meta','counters')) || { key:'counters', values:{} };
  const cur = counters.values[prefix] || 0;
  const next = cur + 1;
  counters.values[prefix] = next;
  await idbPut('meta', counters);
  return prefix + String(next).padStart(3,'0');
}
async function peekAssetNumber(locationName, categoryName){
  const loc = locByName(locationName), cat = catByName(categoryName);
  if(!loc || !cat) return '—';
  const prefix = `${loc.code}-${cat.code}-`;
  const counters = (await idbGet('meta','counters')) || { key:'counters', values:{} };
  const cur = (counters.values[prefix] || 0) + 1;
  return prefix + String(cur).padStart(3,'0');
}

function hexToRgb(hex){
  const m = hex.replace('#','').match(/.{1,2}/g);
  if(!m) return [47,107,79];
  return m.map(h=>parseInt(h,16));
}
function shade(hex, amt){
  const [r,g,b] = hexToRgb(hex);
  const f = c=>Math.max(0, Math.min(255, Math.round(c*(1+amt))));
  return '#' + [f(r),f(g),f(b)].map(c=>c.toString(16).padStart(2,'0')).join('');
}
function tint(hex, amt){
  const [r,g,b] = hexToRgb(hex);
  const f = c=>Math.round(c + (255-c)*amt);
  return '#' + [f(r),f(g),f(b)].map(c=>c.toString(16).padStart(2,'0')).join('');
}
function applyTheme(hex){
  if(!/^#([0-9a-fA-F]{6})$/.test(hex)) return;
  document.documentElement.style.setProperty('--theme-color', hex);
  document.documentElement.style.setProperty('--theme-color-dark', shade(hex,-0.22));
  document.documentElement.style.setProperty('--theme-color-light', tint(hex,0.90));
}
function relLuminance(hex){
  const rgb = hexToRgb(hex).map(c=>{
    c = c/255;
    return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  });
  return 0.2126*rgb[0] + 0.7152*rgb[1] + 0.0722*rgb[2];
}
function applySidebarColor(hex){
  if(!/^#([0-9a-fA-F]{6})$/.test(hex)) return;
  const isDark = relLuminance(hex) < 0.45;
  const root = document.documentElement.style;
  root.setProperty('--sidebar-bg', hex);
  root.setProperty('--sidebar-text', isDark ? '#F3F1E7' : '#21261f');
  root.setProperty('--sidebar-text-muted', isDark ? 'rgba(243,241,231,0.60)' : 'rgba(33,38,31,0.55)');
  root.setProperty('--sidebar-hover', isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.05)');
  root.setProperty('--sidebar-border', isDark ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.08)');
}
function applyDarkMode(isDark){
  const shell = document.getElementById('shell');
  if(shell) shell.classList.toggle('dark', !!isDark);
}

        ${infoCard('Last New Item Received', lastReceived, 'Nothing received yet.')}
        <div id="dash-summary-card" class="bg-white rounded-2xl border border-[#E7E2D3] p-4">
          <div class="flex items-start justify-between mb-3 gap-2">
            <div class="min-w-0">
              <p class="font-display font-semibold text-sm truncate">${dashPeriod==='year'?periodLabel('year'):periodLabel('month')} Summary of Assets and Inventory</p>

function dashboardSearchResultsHtml(query){
  if(!query) return '';
  const q = query.toLowerCase();
  const matches = state.assets.filter(a=> (a.name||'').toLowerCase().includes(q) || (a.assetNumber||'').toLowerCase().includes(q)).slice(0,8);
  if(!matches.length) return `<div class="px-4 py-3 text-xs text-[#a89f85]">No items match "${escapeHtml(query)}".</div>`;
  return matches.map(a=>{
    const c = condMeta(a.condition);
    return `<button data-search-result="${a.id}" class="w-full flex items-center justify-between gap-3 px-4 py-2.5 text-left text-sm hover:bg-[#FAF8F1] border-b border-[#F5F2E8] last:border-0">
      <div class="min-w-0">
        <p class="font-medium truncate">${escapeHtml(a.name)}</p>
        <p class="text-[11px] font-mono text-[#a89f85]">${a.assetNumber} · ${escapeHtml(a.location)}</p>
      </div>
      <span class="text-[11px] px-2 py-0.5 rounded-full shrink-0 ${c.cls}">${a.condition}</span>
    </button>`;
  }).join('');
}
function refreshDashboardSearch(){
  const box = document.getElementById('dash-search-results');
  if(!box) return;
  box.innerHTML = dashboardSearchResultsHtml(dashSearch);
  box.classList.toggle('hidden', !dashSearch);
  bindDashboardSearchResultClicks();
}
function bindDashboardSearchResultClicks(){
  document.querySelectorAll('[data-search-result]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const item = state.assets.find(a=>a.id===b.getAttribute('data-search-result'));
      if(item) openEditor(item);
    });
  });
}

/* ---------------------------------------------------------------------------
   11. LOCATION VIEW (asset groups at a location)
--------------------------------------------------------------------------- */
function renderLocationView(){
  const locName = state.activeLocation;
  const items = state.assets.filter(a=>a.location===locName);
  const groups = {};
  items.forEach(a=>{ (groups[a.assetNumber] = groups[a.assetNumber]||[]).push(a); });
  const groupKeys = Object.keys(groups).sort();

  const cards = groupKeys.map(key=>{
    const list = groups[key];
    const { total, usable } = groupTotals(list);
    const rep = list[0];
    const img = rep.imageSrc
      ? `<img src="${escapeHtml(rep.imageSrc)}" class="w-full h-full object-cover" onerror="window.__cardImgError && window.__cardImgError(this)"/>`
      : iconFallback();

    const conditionRows = list.map(entry=>{
      const c = condMeta(entry.condition);
      return `<div class="flex items-center justify-between py-1.5 border-b border-[#F1EEE3] last:border-0">
        <div class="flex items-center gap-2 min-w-0">
          <span class="text-[11px] px-2 py-0.5 rounded-full font-medium ${c.cls}">${entry.condition}</span>
          <span class="text-xs text-[#8a8471] font-mono">Qty ${entry.qty}</span>
        </div>
        <div class="flex items-center gap-1 shrink-0">
          <button data-edit-entry="${entry.id}" class="p-1.5 rounded-lg hover:bg-[#F1EEE3]" title="Edit">${iconEdit()}</button>
          <button data-dup-entry="${entry.id}" class="p-1.5 rounded-lg hover:bg-[#F1EEE3]" title="Duplicate">${iconDup()}</button>
          <button data-del-entry="${entry.id}" class="p-1.5 rounded-lg hover:bg-red-50 text-red-500" title="Delete">${iconTrash()}</button>
        </div>
      </div>`;
    }).join('');

    return `<div class="bg-white rounded-2xl border border-[#E7E2D3] overflow-hidden">
      <div class="flex gap-4 p-4">
        <div class="w-20 h-20 rounded-xl overflow-hidden bg-[#F1EEE3] shrink-0 flex items-center justify-center text-[#c9c3ac]">${img}</div>
        <div class="min-w-0 flex-1">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <p class="font-display font-semibold truncate">${escapeHtml(rep.name)}</p>
              <p class="text-[11px] font-mono text-[#a89f85]">${key} · ${rep.category}</p>
            </div>
            <div class="flex gap-2 shrink-0">
              <button data-batch="${key}" class="text-[11px] px-2.5 py-1 rounded-lg border border-[#E2DFD3] font-medium hover:bg-[#F1EEE3]">+ Batch</button>
              <button data-split="${key}" class="text-[11px] px-2.5 py-1 rounded-lg theme-bg text-white font-medium">Split</button>
            </div>
          </div>
          <div class="flex gap-4 mt-2">
            <div><p class="text-[10px] uppercase text-[#a89f85] font-semibold">Total Qty</p><p class="font-mono font-semibold text-lg">${total}</p></div>
            <div><p class="text-[10px] uppercase text-[#a89f85] font-semibold">Usable Qty</p><p class="font-mono font-semibold text-lg theme-text">${usable}</p></div>
          </div>
        </div>
      </div>
      <div class="px-4 pb-4">${conditionRows}</div>
    </div>`;
  }).join('');

  return `
  <div class="space-y-5">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="font-display text-2xl font-semibold">${escapeHtml(locName)}</h1>
        <p class="text-sm text-[#8a8471]">${groupKeys.length} asset group${groupKeys.length===1?'':'s'} · ${items.reduce((s,a)=>s+Number(a.qty||0),0)} total pieces</p>
      </div>
      <button data-action="new-item-here" class="flex items-center gap-2 theme-bg text-white px-4 py-2.5 rounded-xl text-sm font-medium">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>New Item
      </button>
    </div>
    ${groupKeys.length ? `<div class="grid md:grid-cols-2 gap-4">${cards}</div>` : emptyState('No assets yet', 'Add the first item for this location to start tracking inventory.')}
  </div>`;
}
function iconFallback(){ return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`; }
function iconEdit(){ return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>`; }
function iconDup(){ return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`; }
function iconTrash(){ return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>`; }

/* ---------------------------------------------------------------------------
   12. EDITOR VIEW — form + live A4 preview, split & batch workflows
--------------------------------------------------------------------------- */
function openEditor(entry, opts){
  opts = opts || {};
  state.editing = entry ? JSON.parse(JSON.stringify(entry)) : {
    id:null, assetNumber:null, name:'', category: CATEGORIES[0].name,
    location: state.activeLocation || LOCATIONS[0].name, qty:1, condition:'Usable',
    purchasePrice:0, purchaseDate:new Date().toISOString().slice(0,10), vendor:'', notes:'', imageSrc:''
  };
  state.splitMode = !!opts.split;
  state.editorBaseAssetNumber = opts.baseAssetNumber || (entry ? entry.assetNumber : null);
  state.editorIsBatch = !!opts.batch;
  state.view = 'editor';
  render();
}

function renderEditorView(){
  const e = state.editing;
  const heading = state.splitMode ? 'Split Item Condition' : (state.editorIsBatch ? 'Add New Batch' : (e.id ? 'Edit Item' : 'New Item'));

  return `
  <div class="space-y-4 max-w-3xl mx-auto">
    <div class="flex items-center gap-3">
      <button data-action="back" class="p-2 rounded-lg hover:bg-[#F1EEE3]" title="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1 class="font-display text-2xl font-semibold flex-1">${heading}</h1>
      <button data-action="back" class="p-2 rounded-lg hover:bg-[#F1EEE3]" title="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>

    <div class="bg-white rounded-2xl border border-[#E7E2D3] p-5 space-y-4" id="editor-form-wrap">
      ${state.splitMode ? renderSplitForm(e) : renderStandardForm(e)}
    </div>
  </div>`;
}

function renderStandardForm(e){
  const catOptions = CATEGORIES.map(c=>`<option value="${c.name}" ${e.category===c.name?'selected':''}>${c.name}</option>`).join('');
  const locOptions = LOCATIONS.map(l=>`<option value="${l.name}" ${e.location===l.name?'selected':''}>${l.name}</option>`).join('');
  const condOptions = CONDITIONS.map(c=>`<option value="${c.key}" ${e.condition===c.key?'selected':''}>${c.key}</option>`).join('');

  return `
    <div class="grid sm:grid-cols-2 gap-4">
      <div class="sm:col-span-2">
        <label class="lbl">Asset Number</label>
        <input id="f-assetnum" type="text" readonly class="inp font-mono bg-[#F7F5EF] text-[#8a8471]" value="${e.assetNumber ? e.assetNumber : 'Auto-generated on save'}"/>
      </div>
      <div class="sm:col-span-2">
        <label class="lbl">Asset Name</label>
        <input id="f-name" type="text" class="inp" value="${escapeHtml(e.name)}" placeholder="e.g. Office Chairs" />
      </div>
      <div>
        <label class="lbl">Category</label>
        <select id="f-category" class="inp">${catOptions}</select>
      </div>
      <div>
        <label class="lbl">Assigned Location</label>
        <select id="f-location" class="inp">${locOptions}</select>
      </div>
      <div>
        <label class="lbl">Quantity</label>
        <input id="f-qty" type="number" min="1" step="1" class="inp" value="${e.qty}"/>
      </div>
      <div>
        <label class="lbl">Condition</label>
        <select id="f-condition" class="inp">${condOptions}</select>
      </div>
      <div>
        <label class="lbl">Purchase Price (per unit)</label>
        <input id="f-price" type="number" min="0" step="0.01" class="inp" value="${e.purchasePrice}"/>
      </div>
      <div>
        <label class="lbl">Purchase Date</label>
        <input id="f-pdate" type="date" class="inp" value="${(e.purchaseDate||'').slice(0,10)}"/>
      </div>
      <div class="sm:col-span-2">
        <label class="lbl">Vendor Details</label>
        <input id="f-vendor" type="text" class="inp" value="${escapeHtml(e.vendor)}" placeholder="Vendor name / contact"/>
      </div>
      <div class="sm:col-span-2">
        <label class="lbl">Notes</label>
        <textarea id="f-notes" rows="2" class="inp">${escapeHtml(e.notes)}</textarea>
      </div>
    </div>

    <div class="border-t border-[#EFEBDD] pt-4">
      <p class="lbl mb-2">Asset Image</p>
      <div class="grid sm:grid-cols-2 gap-3">
        <div class="border border-dashed border-[#DCD7C6] rounded-xl p-3 text-center">
          <p class="text-[11px] font-semibold text-[#8a8471] mb-2">Method A — Local Upload</p>
          <input id="f-image-file" type="file" accept="image/*" class="text-xs w-full"/>
        </div>
        <div class="border border-dashed border-[#DCD7C6] rounded-xl p-3">
          <p class="text-[11px] font-semibold text-[#8a8471] mb-2">Method B — Cloud URL (Google Drive auto-converts)</p>
          <input id="f-image-url" type="text" class="inp text-xs" placeholder="Paste image or Google Drive link" value="${(e.imageSrc && e.imageSrc.startsWith('http'))?escapeHtml(e.imageSrc):''}"/>
          <p class="text-[10px] text-[#a89f85] mt-1.5 leading-snug">In Google Drive, right-click the file → Share → set to <strong>"Anyone with the link"</strong> (Viewer). Restricted files cannot be embedded, even if you're signed in.</p>

      <p id="image-error-note" class="hidden text-[11px] text-red-500 mt-2">This image link couldn't load — the Drive file is probably not shared as "Anyone with the link", or the URL isn't a direct image link.</p>

      <button data-action="clear-form" class="px-5 py-2.5 rounded-xl border border-[#E2DFD3] text-sm font-medium hover:bg-[#F1EEE3]">Clear Form</button>
      ${e.id?`<button data-action="delete-item" class="px-5 py-2.5 rounded-xl border border-red-200 text-red-500 text-sm font-medium hover:bg-red-50 ml-auto">Delete</button>`:''}
    </div>
  `;
}

function renderSplitForm(e){
  const group = state.assets.filter(a=>a.assetNumber===state.editorBaseAssetNumber);
  const totalQty = group.reduce((s,a)=>s+Number(a.qty||0),0);
  const otherConditions = CONDITIONS.filter(c=>c.key!=='Usable');
  const usableMeta = condMeta('Usable');

  const otherRows = otherConditions.map(c=>{
    const existing = group.find(g=>g.condition===c.key);
    return `<div class="flex items-center gap-3">
      <span class="w-24 text-xs font-medium px-2 py-1 rounded-full ${c.cls} text-center">${c.key}</span>
      <input data-split-qty="${c.key}" type="number" min="0" step="1" max="${totalQty}" class="inp flex-1" value="${existing?existing.qty:0}"/>
    </div>`;
  }).join('');

  const usableExisting = group.find(g=>g.condition==='Usable');
  const otherSum = otherConditions.reduce((s,c)=>{ const ex=group.find(g=>g.condition===c.key); return s+(ex?Number(ex.qty):0); },0);
  const usableDefault = usableExisting ? usableExisting.qty : Math.max(0, totalQty - otherSum);

  return `
    <div class="space-y-1 mb-2">
      <p class="text-sm text-[#635e4d]">Asset: <span class="font-mono font-semibold">${state.editorBaseAssetNumber}</span> — ${escapeHtml(group[0]?.name||'')}</p>
      <p class="text-xs text-[#8a8471]">Every item starts as Usable. Enter a quantity for any other condition below and Usable is deducted automatically — it always equals the group's total.</p>
    </div>

    <div class="flex items-center gap-3">
      <span class="w-24 text-xs font-medium px-2 py-1 rounded-full ${usableMeta.cls} text-center">Usable</span>
      <input id="split-usable-display" type="number" class="inp flex-1 bg-[#F7F5EF] text-[#8a8471] font-semibold" value="${usableDefault}" readonly tabindex="-1"/>
    </div>

    <div class="space-y-3 pt-1">${otherRows}</div>

    <div class="flex items-center justify-between pt-2 text-sm">
      <span class="text-[#8a8471]">Group Total</span>
      <span id="split-total-check" class="font-mono font-semibold theme-text">${usableDefault} + ${otherSum} = ${totalQty}</span>
    </div>
    <div class="flex flex-wrap gap-3 pt-3 border-t border-[#EFEBDD]">
      <button data-action="save-split" class="theme-bg text-white px-5 py-2.5 rounded-xl text-sm font-medium">Save Split</button>
      <button data-action="back" class="px-5 py-2.5 rounded-xl border border-[#E2DFD3] text-sm font-medium hover:bg-[#F1EEE3]">Cancel</button>
    </div>
  `;
}

/* ---------------------------------------------------------------------------
   13. LIVE A4 PREVIEW RENDERER
--------------------------------------------------------------------------- */
function a4TemplateHtml(e, forPrint){
  const logo = state.settings.logo ? `<img src="${state.settings.logo}" class="h-12 object-contain"/>` : '';
  const img = e.imageSrc ? `<img src="${e.imageSrc}" class="w-full h-40 object-cover rounded-lg border border-[#E7E2D3]"/>` : `<div class="w-full h-40 rounded-lg border border-dashed border-[#DCD7C6] flex items-center justify-center text-[#c9c3ac] text-xs">No Image</div>`;
  const c = condMeta(e.condition);
  return `
  <div class="flex items-start justify-between border-b-2 pb-4 mb-6" style="border-color:var(--theme-color)">
    <div class="flex items-center gap-3">${logo}<div>
      <p class="font-display font-bold text-lg">${escapeHtml(state.settings.companyName||'Company Name')}</p>
      <p class="text-[10px] text-[#8a8471]">${escapeHtml(state.settings.address||'')}</p>
      <p class="text-[10px] text-[#8a8471]">${[state.settings.phone,state.settings.email,state.settings.website].filter(Boolean).map(escapeHtml).join(' · ')}</p>
    </div></div>
    <div class="text-right">
      <p class="text-[10px] uppercase tracking-wider font-semibold" style="color:var(--theme-color)">Asset Manifest</p>
      <p class="font-mono text-xs mt-1">${e.assetNumber || 'PENDING'}</p>
    </div>

async function saveStandardItem(){
  readFormIntoEditing();
  const e = state.editing;
  if(!e.name){ showToast('Asset name is required.','error'); return; }
  const isNewEntry = !e.id;

  if(!e.assetNumber){
    e.assetNumber = await nextAssetNumber(e.location, e.category);
  }
  if(!e.id) e.id = uuid();
  e.lastUpdated = nowISO();
  if(!e.createdAt) e.createdAt = nowISO();

  await idbPut('assets', e);
  const idx = state.assets.findIndex(a=>a.id===e.id);
  if(idx>=0) state.assets[idx] = e; else state.assets.push(e);

  const actionLabel = isNewEntry ? (state.editorIsBatch ? 'batch added' : 'created') : 'updated';
  await logHistory(actionLabel, e);
  showToast('Item saved successfully.');
  navigateTo('location', e.location);
}

async function deleteCurrentItem(){
  const e = state.editing;
  if(!e || !e.id) return;
  const ok = await askConfirm('Delete this item?', 'This will permanently remove it from active inventory. A history record will be kept.');
  if(!ok) return;
  await idbDelete('assets', e.id);
  state.assets = state.assets.filter(a=>a.id!==e.id);
  await logHistory('deleted', e);
  showToast('Item deleted.','info');
  navigateTo('location', e.location);
}

async function saveSplit(){
  const base = state.editorBaseAssetNumber;
  const group = state.assets.filter(a=>a.assetNumber===base);
  const rep = group[0];
  const totalAllowed = group.reduce((s,a)=>s+Number(a.qty||0),0);

  const rows = document.querySelectorAll('[data-split-qty]');
  let otherSum = 0;
  const values = {};
  rows.forEach(r=>{
    const v = Math.max(0, parseInt(r.value,10)||0);
    values[r.getAttribute('data-split-qty')] = v;
    otherSum += v;
  });
  const usableQty = totalAllowed - otherSum;
  if(usableQty < 0){
    showToast(`Those quantities total ${otherSum}, which is more than the group's ${totalAllowed} pieces.`,'error');
    return;
  }
  values['Usable'] = usableQty;

  // remove old entries for this group, then recreate one entry per non-zero condition
  for(const g of group){ await idbDelete('assets', g.id); }
  state.assets = state.assets.filter(a=>a.assetNumber!==base);

  const nowIso = nowISO();
  for(const [cond, qty] of Object.entries(values)){
    if(qty<=0) continue;
    const entry = {
      id: uuid(), assetNumber: base, name: rep.name, category: rep.category, location: rep.location,
      qty, condition: cond, purchasePrice: rep.purchasePrice, purchaseDate: rep.purchaseDate,
      vendor: rep.vendor, notes: rep.notes, imageSrc: rep.imageSrc, lastUpdated: nowIso, createdAt: rep.createdAt||nowIso
    };
    await idbPut('assets', entry);
    state.assets.push(entry);
    await logHistory('split', entry);
  }
  showToast('Item split saved.');
  navigateTo('location', rep.location);
}

    const id = b.getAttribute('data-dup-entry');
    const entry = state.assets.find(a=>a.id===id);
    if(!entry) return;
    const copy = JSON.parse(JSON.stringify(entry));
    copy.id = uuid();
    copy.assetNumber = await nextAssetNumber(copy.location, copy.category);
    copy.lastUpdated = nowISO(); copy.createdAt = nowISO();
    await idbPut('assets', copy);
    state.assets.push(copy);
    await logHistory('duplicated', copy);
    showToast('Item duplicated.');
    render();
  }));
  document.querySelectorAll('[data-del-entry]').forEach(b=>b.addEventListener('click', async ()=>{
    const id = b.getAttribute('data-del-entry');
    const entry = state.assets.find(a=>a.id===id);
    if(!entry) return;
    const ok = await askConfirm('Delete this entry?', `Remove ${entry.qty} × ${entry.condition} from ${entry.assetNumber}.`);
    if(!ok) return;
    await idbDelete('assets', id);
    state.assets = state.assets.filter(a=>a.id!==id);
    await logHistory('deleted', entry);
    showToast('Entry deleted.','info');
    render();
  }));
  document.querySelectorAll('[data-split]').forEach(b=>b.addEventListener('click', ()=>{

  }));
  document.querySelectorAll('[data-batch]').forEach(b=>b.addEventListener('click', ()=>{
    const base = b.getAttribute('data-batch');
    const rep = state.assets.find(a=>a.assetNumber===base);
    const batchEntry = Object.assign({}, rep, { id:null, qty:1, condition:'Usable', purchaseDate:new Date().toISOString().slice(0,10), createdAt:null, lastUpdated:null });
    openEditor(batchEntry, { batch:true, baseAssetNumber: base });
  }));

  // editor actions
  document.querySelectorAll('[data-action="back"]').forEach(backBtn=>{
    backBtn.addEventListener('click', ()=>{
      const loc = state.editing ? state.editing.location : state.activeLocation;
      navigateTo(loc ? 'location' : 'dashboard', loc);
    });
  });
  const saveBtn = document.querySelector('[data-action="save-item"]');
  if(saveBtn) saveBtn.addEventListener('click', saveStandardItem);
  const clearBtn = document.querySelector('[data-action="clear-form"]');
  if(clearBtn) clearBtn.addEventListener('click', ()=>openEditor(state.editing.id ? state.editing : null, { baseAssetNumber: state.editorBaseAssetNumber }));
  const delBtn = document.querySelector('[data-action="delete-item"]');
  if(delBtn) delBtn.addEventListener('click', deleteCurrentItem);
  const saveSplitBtn = document.querySelector('[data-action="save-split"]');
  if(saveSplitBtn) saveSplitBtn.addEventListener('click', saveSplit);

  // live-updating form fields -> preview + save-on-enter/blur
  const liveIds = ['f-name','f-category','f-location','f-qty','f-condition','f-price','f-pdate','f-vendor','f-notes'];
  liveIds.forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const handler = ()=>{ readFormIntoEditing(); };
    el.addEventListener('input', debounce(handler, 120));
    el.addEventListener('change', handler);
    el.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter' && el.tagName!=='TEXTAREA'){ ev.preventDefault(); handler(); showToast('Synced.', 'info'); } });
  });
  const urlInput = document.getElementById('f-image-url');
  if(urlInput){
    const urlHandler = ()=>{ readFormIntoEditing(); refreshImagePreview(); };
    urlInput.addEventListener('input', debounce(urlHandler, 250));
    urlInput.addEventListener('change', urlHandler);
    urlInput.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter'){ ev.preventDefault(); urlHandler(); showToast('Synced.', 'info'); } });
  }
  const fileInput = document.getElementById('f-image-file');
  if(fileInput){
    fileInput.addEventListener('change', async (ev)=>{
      const file = ev.target.files[0];
      if(!file) return;
      const dataUri = await compressImageFile(file);
      state.editing.imageSrc = dataUri;
      refreshImagePreview();
    });
  }
  document.querySelectorAll('[data-split-qty]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const group = state.assets.filter(a=>a.assetNumber===state.editorBaseAssetNumber);
      const totalQty = group.reduce((s,a)=>s+Number(a.qty||0),0);
      let sum = 0;
      document.querySelectorAll('[data-split-qty]').forEach(r=>{ sum += Math.max(0, parseInt(r.value,10)||0); });
      const usable = totalQty - sum;
      const usableInput = document.getElementById('split-usable-display');
      const label = document.getElementById('split-total-check');
      const invalid = usable < 0;
      if(usableInput){
        usableInput.value = Math.max(0, usable);
        usableInput.classList.toggle('text-red-500', invalid);
      }
      if(label){
        label.textContent = `${Math.max(0,usable)} + ${sum} = ${totalQty}`;
        label.classList.toggle('text-red-500', invalid);
        label.classList.toggle('theme-text', !invalid);
      }
    });
  });

  // history view
  bindHistoryEvents();
  // print & export view
  bindPrintViewEvents();
  // settings view
  bindSettingsEvents();
}

function filterSortHistory(){
  let rows = state.history.slice();
  if(historySearch){
    const q = historySearch.toLowerCase();
    rows = rows.filter(h=> (h.itemName||'').toLowerCase().includes(q) || (h.assetNumber||'').toLowerCase().includes(q) || (h.location||'').toLowerCase().includes(q) || (h.category||'').toLowerCase().includes(q));
  }
  switch(historySort){
    case 'date_asc': rows.sort((a,b)=> new Date(a.date)-new Date(b.date)); break;
    case 'name': rows.sort((a,b)=> (a.itemName||'').localeCompare(b.itemName||'')); break;
    case 'location': rows.sort((a,b)=> (a.location||'').localeCompare(b.location||'')); break;
    case 'category': rows.sort((a,b)=> (a.category||'').localeCompare(b.category||'')); break;
    default: rows.sort((a,b)=> new Date(b.date)-new Date(a.date));
  }
  return rows;
}

  const tbody = document.getElementById('hist-tbody');
  if(!tbody) return;
  tbody.innerHTML = historyRowsHtml(filterSortHistory());
  bindHistoryRowActions();

function bindHistoryEvents(){

  const so = document.getElementById('hist-sort');
  if(so) so.addEventListener('change', ()=>{ historySort = so.value; refreshHistoryTable(); });
  bindHistoryRowActions();

function bindHistoryRowActions(){

    const rec = state.history.find(h=>h.id===b.getAttribute('data-hist-pdf'));
    if(rec) exportSinglePdf(rec);

  document.querySelectorAll('[data-hist-del]').forEach(b=>b.addEventListener('click', async ()=>{

    showToast('History record deleted.','info');
    render();
  }));
}

/* ---------------------------------------------------------------------------
   18. IMPORT / EXPORT (full DB JSON backup)
--------------------------------------------------------------------------- */
async function exportAllData(){
  const payload = {
    exportedAt: nowISO(),
    version: state.meta.version,
    assets: state.assets,
    history: state.history,
    settings: state.settings,
    categories: CATEGORIES,
    meta: { version: state.meta.version, changelog: state.meta.changelog }
  };
  const blob = new Blob([JSON.stringify(payload,null,2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `gaia-lake-assets-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  showToast('Backup exported.');
}
async function importAllData(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || !Array.isArray(data.assets)) throw new Error('Invalid backup file structure.');

    const ok = await askConfirm('Import backup?', 'This will replace all current assets, history, and settings with the backup contents.');
    if(!ok) return;

    await idbClear('assets'); await idbClear('history'); await idbClear('settings'); await idbClear('meta');

    for(const a of data.assets) await idbPut('assets', a);
    for(const h of (data.history||[])) await idbPut('history', h);
    if(data.settings) await idbPut('settings', Object.assign({key:'main'}, data.settings));
    const importedCategories = Array.isArray(data.categories) && data.categories.length ? data.categories : DEFAULT_CATEGORIES.map(c=>Object.assign({},c));
    await idbPut('meta', { key:'categories', list: importedCategories });
    CATEGORIES = importedCategories;
    const metaVersion = data.meta && data.meta.version ? data.meta.version : '1.1';
    const metaChangelog = data.meta && data.meta.changelog ? data.meta.changelog : DEFAULT_CHANGELOG;
    await idbPut('meta', { key:'version', version: metaVersion, changelog: metaChangelog });
    // rebuild counters from imported asset numbers so future numbering doesn't collide
    const counters = { key:'counters', values:{} };
    data.assets.forEach(a=>{
      const parts = (a.assetNumber||'').split('-');
      if(parts.length===3){
        const prefix = parts[0]+'-'+parts[1]+'-';
        const n = parseInt(parts[2],10)||0;
        counters.values[prefix] = Math.max(counters.values[prefix]||0, n);
      }
    });
    await idbPut('meta', counters);

    await loadAllData();
    showToast('Backup imported successfully.');
    navigateTo('dashboard');
  }catch(err){
    showToast('Import failed: '+err.message,'error');
  }
  e.target.value = '';
}

  if(label) label.textContent = text;
  const sideDot = document.getElementById('cloud-dot-sidebar');
  if(sideDot) sideDot.className = 'cloud-dot ' + kind;
}

/* ---- OAuth (Google Identity Services) ------------------------------------ */
function attemptSilentCloudSignIn(){
  if(!state.cloud.clientId || !state.cloud.folderId){ updateCloudBanner(); return; }
  let tries = 0;
  const poll = setInterval(()=>{
    tries++;
    if(ensureGisReady()){
      clearInterval(poll);
      try{
        gisTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: state.cloud.clientId, scope: CLOUD_SCOPES,
          callback: onCloudTokenResponse,
          error_callback: ()=>{ updateCloudBanner(); }
        });
        gisTokenClient.__clientId = state.cloud.clientId;
        gisTokenClient.requestAccessToken({ prompt:'none' });
      }catch(e){ updateCloudBanner(); }
    } else if(tries > 25){ clearInterval(poll); updateCloudBanner(); }
  }, 200);
}
function cloudSignIn(){
  if(!state.cloud.clientId || !state.cloud.folderId){
    showToast('Enter and save your Google Client ID and Shared Folder ID in Settings first.','error');
    navigateTo('settings'); return;
  }
  if(!ensureGisReady()){
    showToast('Google Sign-In library is still loading — please try again in a moment.','error'); return;
  }
  if(!gisTokenClient || gisTokenClient.__clientId !== state.cloud.clientId){
    gisTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: state.cloud.clientId, scope: CLOUD_SCOPES,
      callback: onCloudTokenResponse,
      error_callback: (err)=>{ showToast('Google Sign-In failed: '+(err&&err.type?err.type:'unknown error'),'error'); }
    });
    gisTokenClient.__clientId = state.cloud.clientId;
  }
  gisTokenClient.requestAccessToken({ prompt:'consent' });
}
async function onCloudTokenResponse(resp){
  if(!resp || !resp.access_token){ showToast('Google Sign-In did not return an access token.','error'); return; }
  state.cloud.accessToken = resp.access_token;
  state.cloud.tokenExpiresAt = Date.now() + (Number(resp.expires_in||3600)*1000) - 60000;
  state.cloud.connected = true;
  scheduleTokenRefresh();
  try{
    const profile = await driveFetchJson('https://www.googleapis.com/oauth2/v3/userinfo');
    state.cloud.userEmail = profile && profile.email ? profile.email : null;
  }catch(e){ /* non-fatal — email is cosmetic only */ }
  showToast('Signed in to Google Drive.');
  await cloudInitialConnect();
}
function scheduleTokenRefresh(){
  clearTimeout(cloudRefreshTimer);
  const ms = Math.max(5000, state.cloud.tokenExpiresAt - Date.now());
  cloudRefreshTimer = setTimeout(()=>{ if(gisTokenClient) gisTokenClient.requestAccessToken({ prompt:'' }); }, ms);
}
function cloudSignOut(){
  try{ if(state.cloud.accessToken && ensureGisReady()) google.accounts.oauth2.revoke(state.cloud.accessToken, ()=>{}); }catch(e){}
  state.cloud.connected = false; state.cloud.accessToken = null; state.cloud.userEmail = null;
  clearTimeout(cloudRefreshTimer); clearInterval(cloudPollTimer);
  setCloudStatus('off','Offline');
  showToast('Signed out of Google Drive.','info');
  render();
}

/* ---- Drive REST helpers (fetch + Bearer token; no gapi.client needed) ---- */
async function driveFetchJson(url, opts){
  opts = opts || {};
  const headers = Object.assign({}, opts.headers||{}, { Authorization: 'Bearer '+state.cloud.accessToken });
  const res = await fetch(url, Object.assign({}, opts, { headers }));
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error(`Drive API ${res.status}: ${errText.slice(0,200)}`);
  }
  const ct = res.headers.get('content-type')||'';
  return ct.includes('application/json') ? res.json() : res.text();
}
async function findMasterFile(){
  const q = encodeURIComponent(`name='${CLOUD_FILE_NAME}' and '${state.cloud.folderId}' in parents and trashed=false`);
  const data = await driveFetchJson(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&spaces=drive`);
  return (data.files && data.files[0]) || null;
}
async function createMasterFile(payload){
  const boundary = 'gaiaLakeBoundary' + Date.now();
  const metadata = { name: CLOUD_FILE_NAME, parents:[state.cloud.folderId], mimeType:'application/json' };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(payload)}\r\n` +
    `--${boundary}--`;
  return driveFetchJson('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime', {
    method:'POST', headers:{ 'Content-Type': `multipart/related; boundary=${boundary}` }, body
  });
}
async function updateMasterFile(fileId, payload){
  return driveFetchJson(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media&fields=id,modifiedTime`, {
    method:'PATCH', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload)
  });
}
async function downloadMasterFile(fileId){
  return driveFetchJson(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
}
async function getMasterFileMeta(fileId){
  return driveFetchJson(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=modifiedTime`);
}

/* ---- Payload build / apply ------------------------------------------------ */
async function buildCloudPayload(){
  const counters = await idbGet('meta','counters');
  return {
    savedAt: nowISO(),
    assets: state.assets,
    history: state.history,
    settings: state.settings,
    categories: CATEGORIES,
    meta: { version: state.meta.version, changelog: state.meta.changelog },
    counters: counters ? counters.values : {}
  };
}
async function applyRemoteData(remote){
  if(!remote || !Array.isArray(remote.assets)) return;
  state.cloud.applyingRemote = true;
  try{
    await idbClear('assets'); await idbClear('history'); await idbClear('settings'); await idbClear('meta');
    for(const a of remote.assets) await idbPut('assets', a);
    for(const h of (remote.history||[])) await idbPut('history', h);
    if(remote.settings) await idbPut('settings', Object.assign({key:'main'}, remote.settings));
    const cats = Array.isArray(remote.categories) && remote.categories.length ? remote.categories : DEFAULT_CATEGORIES.map(c=>Object.assign({},c));
    await idbPut('meta', { key:'categories', list: cats });
    const metaVersion = remote.meta && remote.meta.version ? remote.meta.version : state.meta.version;
    const metaChangelog = remote.meta && remote.meta.changelog ? remote.meta.changelog : state.meta.changelog;
    await idbPut('meta', { key:'version', version: metaVersion, changelog: metaChangelog });
    await idbPut('meta', { key:'counters', values: remote.counters || {} });
    await idbPut('settings', {
      key:'cloud', clientId: state.cloud.clientId, apiKey: state.cloud.apiKey,
      folderId: state.cloud.folderId, fileId: state.cloud.fileId
    });
    await loadAllData();
    render();
  } finally {
    state.cloud.applyingRemote = false;
  }
}

/* ---- Connect / push / poll ------------------------------------------------ */
async function cloudInitialConnect(){
  updateCloudBanner(); renderCloudSidebar();
  try{
    setCloudStatus('busy','Connecting…');
    const existing = await findMasterFile();
    if(existing){
      state.cloud.fileId = existing.id;
      await saveCloudConfigToDB();
      const remote = await downloadMasterFile(existing.id);
      await applyRemoteData(remote);
      state.cloud.lastRemoteModified = existing.modifiedTime;
      showToast('Loaded the live database from Google Drive.');
    } else {
      const payload = await buildCloudPayload();
      const created = await createMasterFile(payload);
      state.cloud.fileId = created.id;
      state.cloud.lastRemoteModified = created.modifiedTime;
      await saveCloudConfigToDB();
      showToast(`Created ${CLOUD_FILE_NAME} in the shared folder.`);
    }
    state.cloud.lastSync = nowISO();
    setCloudStatus('on','Synced');
    clearInterval(cloudPollTimer);
    cloudPollTimer = setInterval(pollCloud, CLOUD_POLL_MS);
  }catch(err){
    setCloudStatus('off','Error');
    showToast('Google Drive connection failed: '+err.message,'error');
  }
  render();
}
function scheduleCloudPush(){
  if(typeof state === 'undefined' || !state.cloud) return;
  if(!state.cloud.connected || !state.cloud.fileId || state.cloud.applyingRemote){ if(state.cloud) state.cloud.dirty = true; return; }
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(()=>{ pushToCloud(); }, 500);
}
async function pushToCloud(){
  if(!state.cloud.connected || !state.cloud.fileId || state.cloud.applyingRemote) return;
  try{
    state.cloud.syncing = true; setCloudStatus('busy','Syncing…'); renderCloudSidebar();
    const payload = await buildCloudPayload();
    const updated = await updateMasterFile(state.cloud.fileId, payload);
    state.cloud.lastRemoteModified = updated.modifiedTime;
    state.cloud.lastSync = nowISO();
    state.cloud.dirty = false;
    setCloudStatus('on','Synced');
  }catch(err){
    setCloudStatus('off','Sync error');
    showToast('Cloud sync failed: '+err.message,'error');
  } finally {
    state.cloud.syncing = false; renderCloudSidebar();
  }
}
async function pollCloud(){
  if(!state.cloud.connected || !state.cloud.fileId || state.cloud.syncing || state.cloud.applyingRemote) return;
  try{
    const meta = await getMasterFileMeta(state.cloud.fileId);
    if(meta.modifiedTime && meta.modifiedTime !== state.cloud.lastRemoteModified){
      const remote = await downloadMasterFile(state.cloud.fileId);
      await applyRemoteData(remote);
      state.cloud.lastRemoteModified = meta.modifiedTime;
      state.cloud.lastSync = nowISO();
      showToast('Synced changes from another device.','info');
    }
  }catch(err){
    // Transient poll errors (e.g. expired token mid-refresh) are silent;
    // the next successful poll or manual Sync Now will recover.
  }
}
async function cloudManualSync(){
  if(!state.cloud.connected){ showToast('Sign in to Google Drive first.','error'); return; }
  await pollCloud();
  if(state.cloud.dirty) await pushToCloud();
  showToast('Sync check complete.');
}

/* ---------------------------------------------------------------------------
   19. PRINT / PDF ENGINE
--------------------------------------------------------------------------- */
function sortedFilteredAssets(){
  let rows = state.assets.slice();
  if(state.printSelection.location !== 'all'){
    rows = rows.filter(a=>a.location===state.printSelection.location);
  }
  const key = state.printSelection.sortBy;
  rows.sort((a,b)=>{
    const av = key==='assetNumber' ? a.assetNumber : (a[key]||'');
    const bv = key==='assetNumber' ? b.assetNumber : (b[key]||'');
    return String(av).localeCompare(String(bv));
  });
  return rows;
}

function buildManifestHtml(rows){
  const logo = state.settings.logo ? `<img src="${state.settings.logo}" class="h-12 object-contain"/>` : '';
  const groups = {};
  rows.forEach(r=>{ (groups[r.assetNumber]=groups[r.assetNumber]||[]).push(r); });

  let body = `<div class="flex items-start justify-between border-b-2 pb-4 mb-6" style="border-color:var(--theme-color)">
      <div class="flex items-center gap-3">${logo}<div>
        <p class="font-display font-bold text-lg">${escapeHtml(state.settings.companyName)}</p>
        <p class="text-[10px] text-[#8a8471]">${escapeHtml(state.settings.address)}</p>
      </div></div>
      <div class="text-right"><p class="text-[10px] uppercase font-semibold" style="color:var(--theme-color)">Full Inventory Manifest</p>
      <p class="text-[10px] text-[#8a8471]">${state.printSelection.location==='all'?'All Locations':escapeHtml(state.printSelection.location)}</p></div>
    </div>
    <table class="w-full text-[10px] border-collapse">
      <thead><tr class="text-left border-b-2" style="border-color:var(--theme-color)">
        <th class="py-1.5 pr-2">Asset #</th><th class="py-1.5 pr-2">Name</th><th class="py-1.5 pr-2">Category</th>
        <th class="py-1.5 pr-2">Location</th><th class="py-1.5 pr-2">Qty</th><th class="py-1.5 pr-2">Condition</th><th class="py-1.5 pr-2">Updated</th>
      </tr></thead><tbody>`;
  rows.forEach(r=>{
    body += `<tr class="border-b border-[#EFEBDD]"><td class="py-1 pr-2 font-mono">${r.assetNumber}</td><td class="py-1 pr-2">${escapeHtml(r.name)}</td>
      <td class="py-1 pr-2">${escapeHtml(r.category)}</td><td class="py-1 pr-2">${escapeHtml(r.location)}</td>
      <td class="py-1 pr-2">${r.qty}</td><td class="py-1 pr-2">${r.condition}</td><td class="py-1 pr-2">${fmtDate(r.lastUpdated)}</td></tr>`;
  });
  body += `</tbody></table>`;
  body += a4FooterHtml(1,1);
  return body;
}

function printSingle(item){
  renderPrintRoot(a4TemplateHtml(item, true));
  setTimeout(()=>window.print(), 150);
}
function printManifest(asPdf){
  const rows = sortedFilteredAssets();
  const html = buildManifestHtml(rows);
  if(!asPdf){
    renderPrintRoot(html);
    setTimeout(()=>window.print(), 150);
  } else {
    exportPdfFromHtml(html, `inventory-manifest-${new Date().toISOString().slice(0,10)}.pdf`, 'download');
  }
}
function viewManifestPdf(){
  const rows = sortedFilteredAssets();
  if(!rows.length){ showToast('No items match this filter yet.','error'); return; }
  const html = buildManifestHtml(rows);
  exportPdfFromHtml(html, `inventory-manifest-${new Date().toISOString().slice(0,10)}.pdf`, 'view');
}
function renderPrintRoot(html){
  let root = document.getElementById('print-root');
  if(!root){
    root = document.createElement('div');
    root.id = 'print-root';
    document.body.appendChild(root);
  }
  root.innerHTML = `<div class="p-10 bg-white">${html}</div>`;
}
async function exportSinglePdf(item){
  await exportPdfFromHtml(a4TemplateHtml(item, true), `${item.assetNumber||'asset'}-manifest.pdf`, 'download');
}
async function downloadSummaryCardImage(){
  const el = document.getElementById('dash-summary-card');
  if(!el) return;
  try{
    const canvas = await html2canvas(el, {
      scale:2, backgroundColor:'#ffffff',
      ignoreElements: (node)=> !!(node.classList && node.classList.contains('no-capture'))
    });
    const link = document.createElement('a');
    link.download = `assets-inventory-summary-${dashPeriod}-${new Date().toISOString().slice(0,10)}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('Summary image downloaded.');
  }catch(err){
    showToast('Could not generate image: '+err.message, 'error');
  }
}
async function exportPdfFromHtml(html, filename, mode){
  mode = mode || 'download';
  renderPrintRoot(html);
  const root = document.getElementById('print-root');
  root.style.position='fixed'; root.style.left='-9999px'; root.style.top='0'; root.style.width='210mm';
  root.classList.remove('hidden');
  await new Promise(r=>setTimeout(r,80));
  try{
    const canvas = await html2canvas(root, { scale:2, useCORS:true, backgroundColor:'#ffffff' });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageWidth = 210, pageHeight = 297;
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    let heightLeft = imgHeight, position = 0, page = 1;
    const totalPages = Math.max(1, Math.ceil(imgHeight/pageHeight));
    pdf.addImage(canvas.toDataURL('image/jpeg',0.92), 'JPEG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      page++;
      pdf.addImage(canvas.toDataURL('image/jpeg',0.92), 'JPEG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    if(mode==='view'){
      const blobUrl = pdf.output('bloburl');
      const win = window.open(blobUrl, '_blank');
      if(!win){ showToast('Your browser blocked the preview pop-up — allow pop-ups to view the PDF.','error'); }
      else showToast('PDF preview opened in a new tab. Nothing has been downloaded yet.','info');
    } else {
      pdf.save(filename);
      showToast('PDF exported.');
    }
  }catch(err){
    showToast('PDF export failed: '+err.message, 'error');
  } finally {
    root.style.position=''; root.style.left=''; root.style.width='';
    root.innerHTML='';
  }
}
window.addEventListener('afterprint', ()=>{ const r=document.getElementById('print-root'); if(r) r.innerHTML=''; });

  if(existing.length) return;

  const seedDefs = [
    { location:'Manager Room', category:'Furniture', name:'Office Chairs', qty:4, condition:'Usable', price:45.00, vendor:'Kandy Furniture Co.' },
    { location:'Main Kitchen', category:'Appliances', name:'Commercial Refrigerator', qty:1, condition:'Usable', price:1250.00, vendor:'ColdTech Lanka' },
    { location:'Generator Room', category:'Utilities', name:'Backup Generator System 20kVA', qty:1, condition:'Usable', price:3800.00, vendor:'PowerGen Sri Lanka' },
    { location:'Room 1', category:'Electronics', name:'Smart LED Television 43"', qty:1, condition:'Usable', price:320.00, vendor:'Softlogic Retail' },
    { location:'Guest Pantry', category:'Linen', name:'Cotton Bath Towels', qty:12, condition:'Usable', price:8.50, vendor:'Textura Mills' },
    { location:'Lobby', category:'Furniture', name:'Rattan Lounge Sofa Set', qty:2, condition:'Usable', price:410.00, vendor:'Moratuwa Woodcraft' },
  ];

  const nowIso = nowISO();

      id: uuid(), assetNumber, name: def.name, category: def.category, location: def.location,

    state.assets.push(entry);
    await logHistory('created', entry);
  }
}

   21. BOOT
--------------------------------------------------------------------------- */
async function loadAllData(){
  state.assets = await idbGetAll('assets');
  state.history = (await idbGetAll('history')).sort((a,b)=> new Date(b.date)-new Date(a.date));
  await loadCategories();
  await loadSettings();
  await loadCloudConfig();
  await initMeta();
}

async function boot(){
  try{
    await openDB();
    await loadAllData();
    await seedIfEmpty();
    render();
    window.addEventListener('online', updateCloudBanner);
    window.addEventListener('offline', updateCloudBanner);
    attemptSilentCloudSignIn();
  }catch(err){
    document.getElementById('view-root').innerHTML = `<div class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-6">
      <p class="font-semibold mb-1">Failed to initialize local database.</p><p class="text-sm">${escapeHtml(err.message||String(err))}</p>
    </div>`;
  }
}
